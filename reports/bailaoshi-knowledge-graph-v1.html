<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白老師國際語言中心 — 系統模組知識圖譜 v1.0</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  --ember: #C4502A; --teal: #2A7A6E; --gold: #B8923A;
  --ink: #12121A; --slate: #5A5A6E; --mist: #9898A8;
  --border: #E2E0DA; --parchment: #F7F5F0; --snow: #FDFCFA;
  --p0: #7C3AED; --p1: #C4502A; --p2: #B8923A;
  --p3: #2A7A6E; --p4: #5A5A6E; --p5: #6A4A9A; --p6: #D44422;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--parchment); color: var(--ink); }

.hero {
  background: linear-gradient(135deg, #12121A 0%, #1e2840 60%, #2A3A5A 100%);
  color: #fff; padding: 36px 32px 30px; text-align: center; position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 50%, rgba(196,80,42,0.15) 0%, transparent 70%),
              radial-gradient(ellipse at 70% 50%, rgba(42,122,110,0.1) 0%, transparent 70%);
}
.hero-tag {
  display: inline-block; background: rgba(196,80,42,0.2); border: 1px solid rgba(196,80,42,0.4);
  color: #E0714D; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
  padding: 4px 14px; border-radius: 20px; margin-bottom: 14px; position: relative;
}
.hero h1 { font-size: clamp(18px, 3vw, 30px); font-weight: 700; position: relative; margin-bottom: 8px; }
.hero h1 span { color: #E0714D; }
.hero p { font-size: 13px; color: rgba(255,255,255,0.55); position: relative; }

.controls {
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100; align-items: center;
}
.ctrl-btn {
  padding: 5px 13px; border-radius: 20px; font-size: 11px; font-weight: 600;
  cursor: pointer; border: 1.5px solid currentColor; background: transparent;
  transition: background 0.15s, color 0.15s; letter-spacing: 0.3px; line-height: 1.4;
}
.ctrl-btn.active { color: #fff !important; }
.ctrl-btn[data-phase="all"] { color: var(--ink); border-color: var(--ink); }
.ctrl-btn[data-phase="all"].active { background: var(--ink); }
.ctrl-btn[data-phase="P0"] { color: var(--p0); }
.ctrl-btn[data-phase="P0"].active { background: var(--p0); border-color: var(--p0); }
.ctrl-btn[data-phase="P1"] { color: var(--p1); }
.ctrl-btn[data-phase="P1"].active { background: var(--p1); border-color: var(--p1); }
.ctrl-btn[data-phase="P2"] { color: var(--p2); }
.ctrl-btn[data-phase="P2"].active { background: var(--p2); border-color: var(--p2); }
.ctrl-btn[data-phase="P3"] { color: var(--p3); }
.ctrl-btn[data-phase="P3"].active { background: var(--p3); border-color: var(--p3); }
.ctrl-btn[data-phase="P4"] { color: var(--p4); }
.ctrl-btn[data-phase="P4"].active { background: var(--p4); border-color: var(--p4); }
.ctrl-btn[data-phase="P5"] { color: var(--p5); }
.ctrl-btn[data-phase="P5"].active { background: var(--p5); border-color: var(--p5); }
.ctrl-btn[data-phase="P6"] { color: var(--p6); }
.ctrl-btn[data-phase="P6"].active { background: var(--p6); border-color: var(--p6); }
.ctrl-sep { width: 1px; height: 20px; background: var(--border); }

#graph-wrap { background: #fff; overflow: hidden; }
svg#graph { display: block; width: 100%; cursor: grab; }
svg#graph:active { cursor: grabbing; }

.node circle { stroke-width: 2.5; cursor: pointer; }
.node .node-icon { font-size: 13px; text-anchor: middle; pointer-events: none; dominant-baseline: central; }
.node .node-label { font-size: 9.5px; fill: var(--ink); text-anchor: middle; pointer-events: none; font-weight: 500; }
.node .risk-ring { pointer-events: none; }

.link { fill: none; }
.link.depends  { stroke: #b0b0be; stroke-width: 1.5; stroke-opacity: 0.5; }
.link.extends  { stroke: #2A7A6E; stroke-width: 1.5; stroke-opacity: 0.5; stroke-dasharray: 5,3; }
.link.api      { stroke: #6A4A9A; stroke-width: 1.5; stroke-opacity: 0.5; stroke-dasharray: 4,2; }
.link.ai       { stroke: #D44422; stroke-width: 1.5; stroke-opacity: 0.5; stroke-dasharray: 2,2; }
.link.highlight { stroke-opacity: 0.9 !important; stroke-width: 2.5 !important; }
.link.dim      { stroke-opacity: 0.05 !important; }
.node.dim circle  { opacity: 0.12; }
.node.dim .node-icon { opacity: 0.12; }
.node.dim .node-label { opacity: 0.12; }
.node.dim .risk-ring { opacity: 0.12; }

.phase-bg  { fill-opacity: 0.025; rx: 8; }
.phase-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill-opacity: 0.45; text-anchor: middle; }

#tooltip {
  position: fixed; display: none;
  background: #12121A; color: rgba(255,255,255,0.92);
  font-size: 12px; line-height: 1.85;
  padding: 12px 16px; border-radius: 10px;
  max-width: 280px; z-index: 9999;
  pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.tt-phase { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.7; margin-bottom: 4px; }
.tt-name  { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.tt-desc  { font-size: 12px; opacity: 0.82; line-height: 1.65; }

#detail {
  display: none; position: fixed; right: 16px; top: 110px;
  width: 272px; background: #fff;
  border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  z-index: 200; font-size: 13px;
  max-height: calc(100vh - 130px); overflow-y: auto;
}
#detail .d-close {
  position: absolute; right: 12px; top: 10px; cursor: pointer;
  color: var(--mist); font-size: 18px; line-height: 1;
}
#detail .d-close:hover { color: var(--ink); }
#detail .d-phase  { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--mist); margin-bottom: 6px; }
#detail .d-name   { font-size: 15px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
#detail .d-unit   { font-size: 12px; color: var(--slate); margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
#detail .d-sec    { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--mist); margin: 10px 0 5px; }
#detail .d-list   { list-style: none; display: flex; flex-direction: column; gap: 4px; }
#detail .d-list li { font-size: 12px; color: var(--slate); padding-left: 14px; position: relative; line-height: 1.5; }
#detail .d-list li::before { content: '→'; position: absolute; left: 0; color: var(--mist); }
#detail .d-badge-legal {
  display: inline-block; background: #FEF0EC; color: var(--ember);
  font-size: 10px; border-radius: 4px; padding: 2px 8px; margin-bottom: 8px;
  border: 1px solid rgba(196,80,42,0.3); font-weight: 600;
}

.legend {
  display: flex; gap: 16px; flex-wrap: wrap;
  padding: 10px 24px; background: var(--parchment);
  border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--slate); align-items: center; justify-content: center;
}
.leg-item { display: flex; align-items: center; gap: 5px; }
.leg-dot  { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.leg-line { display: inline-block; width: 22px; height: 0; border-top: 2px solid; vertical-align: middle; flex-shrink: 0; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-tag">Knowledge Graph</div>
  <h1>白老師國際語言中心<br><span>系統模組知識圖譜</span></h1>
  <p>44 個模組 · 顯示模組間的依賴與資料流 · 左到右是系統演化方向 · 點擊節點查看詳情</p>
</div>

<div class="controls" id="controls">

  <button class="ctrl-btn" data-phase="P2">P2 財務合規</button>
  <button class="ctrl-btn" data-phase="P3">P3 深化</button>

  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" id="btn-reset" style="color:var(--slate);">重置視圖</button>
</div>

<div id="graph-wrap">
  <svg id="graph"></svg>
</div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:var(--p0)"></div> P0 底層</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--p1)"></div> P1 核心</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--p2)"></div> P2 財務合規</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--p3)"></div> P3 深化</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--p4)"></div> P4 前台</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--p5)"></div> P5 API</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--p6)"></div> P6 AI</div>
  <div class="ctrl-sep" style="height:18px; align-self:auto;"></div>
  <div class="leg-item"><div class="leg-line" style="border-color:#b0b0be;"></div> 資料依賴</div>
  <div class="leg-item"><div class="leg-line" style="border-color:var(--teal); border-style:dashed;"></div> 功能延伸</div>
  <div class="leg-item"><div class="leg-line" style="border-color:var(--p5); border-style:dashed;"></div> API串接</div>
  <div class="leg-item"><div class="leg-line" style="border-color:var(--p6); border-style:dotted;"></div> AI輸入</div>
  <div style="color:var(--mist); font-size:11px;">← 滑鼠移到節點查看說明 · 點擊查看詳情 · 滾輪縮放 · 拖曳平移</div>
</div>

<div id="tooltip">
  <div class="tt-phase" id="tt-phase"></div>
  <div class="tt-name"  id="tt-name"></div>
  <div class="tt-desc"  id="tt-desc"></div>
</div>

<div id="detail">
  <span class="d-close" onclick="document.getElementById('detail').style.display='none'">×</span>
  <div class="d-phase" id="d-phase"></div>
  <div class="d-name"  id="d-name"></div>
  <div class="d-unit"  id="d-unit"></div>
  <div id="d-legal-badge" style="display:none"><div class="d-badge-legal">⚠️ 法律風險模組</div></div>
  <div id="d-deps-sec"    style="display:none"><div class="d-sec">前置依賴</div><ul class="d-list" id="d-deps"></ul></div>
  <div id="d-enables-sec" style="display:none; margin-top:2px;"><div class="d-sec">解鎖模組</div><ul class="d-list" id="d-enables"></ul></div>
</div>

  {id:'MOD18x',short:'行銷擴充',     label:'行銷\n（擴充）',  phase:'P4', unit:'行銷', icon:'📣', desc:'口碑來源追蹤、說明會/活動報名、各管道成交率分析（MOD 18 延伸）', legal:false},
  // P5
  {id:'API01', short:'API 行政串接', label:'API\n行政串接',  phase:'P5', unit:'MUSEON API 串接', icon:'🔌', desc:'學生建檔/出缺席/報名就讀，MUSEON 可做行政流程智能提醒', legal:false},
  {id:'API02', short:'API 總務串接', label:'API\n總務串接',  phase:'P5', unit:'MUSEON API 串接', icon:'🔌', desc:'場地排課/設備管理，MUSEON 回答「今天哪間教室有空」', legal:false},
  {id:'API03', short:'API 客服串接', label:'API\n客服串接',  phase:'P5', unit:'MUSEON API 串接', icon:'🔌', desc:'家長詢問/投訴紀錄，MUSEON 輔助快速查詢學生狀態', legal:false},
  {id:'API04', short:'API 行銷串接', label:'API\n行銷串接',  phase:'P5', unit:'MUSEON API 串接', icon:'🔌', desc:'說明會報名/招生來源/活動成效，自動產製招生分析報告', legal:false},
  // P6
  {id:'MOD19', short:'AI 學習助理', label:'AI\n學習助理',  phase:'P6', unit:'AI 智慧輔助', icon:'🤖', desc:'個人化學習建議/出席異常預警/每週進度摘要，主動推播家長不需問', legal:false},
  {id:'MOD20', short:'AI 作業批改', label:'AI\n作業批改',  phase:'P6', unit:'AI 智慧輔助', icon:'📋', desc:'AI 初評 + 老師最終審核，大幅縮短批改時間', legal:false},
  {id:'MOD21', short:'AI 口說練習', label:'AI\n口說練習',  phase:'P6', unit:'AI 智慧輔助', icon:'🎤', desc:'⭐ 簽約前提 Demo：學生與 AI 對話練英文，評估發音/流暢度/進步軌跡', legal:false},
  {id:'MOD22', short:'AI 行政檢查', label:'AI\n行政檢查', phase:'P6', unit:'AI 智慧輔助', icon:'🔍', desc:'每日自動掃描異常：欠費未通知/出缺席異常/補課逾期，主動提醒行政', legal:false},
  {id:'MOD25', short:'AI 客製出題', label:'AI\n客製出題',  phase:'P6', unit:'AI 智慧輔助', icon:'📝', desc:'根據學員歷史識別弱點，生成個人化練習題，老師審核後發送', legal:false},
];

const links = [
  // L0 → P1
  {source:'MOD14', target:'MOD03',  type:'depends'},
  {source:'MOD14', target:'MOD07',  type:'depends'},
  {source:'MOD14', target:'MOD10',  type:'depends'},
  {source:'MOD04', target:'MOD03',  type:'depends'},
  {source:'MOD04', target:'MOD11',  type:'depends'},
  {source:'MOD01a',target:'MOD06',  type:'depends'},
  {source:'MOD01b',target:'MOD33b', type:'depends'},
  {source:'MOD01b',target:'MOD06',  type:'depends'},
  {source:'MOD01b',target:'MOD29',  type:'depends'},
  {source:'MOD01b',target:'MOD27',  type:'depends'},
  {source:'MOD01b',target:'MOD30',  type:'depends'},
  {source:'MOD01b',target:'MOD31',  type:'depends'},
  {source:'MOD01b',target:'MOD05',  type:'depends'},
  {source:'MOD01b',target:'MOD23',  type:'depends'},
  {source:'MOD02', target:'MOD07',  type:'depends'},
  // P1 internal
  {source:'MOD03', target:'MOD06',  type:'depends'},
  {source:'MOD03', target:'MOD07',  type:'depends'},
  {source:'MOD03', target:'MOD08',  type:'depends'},
  {source:'MOD03', target:'MOD10',  type:'depends'},
  {source:'MOD03', target:'MOD05',  type:'depends'},
  {source:'MOD06', target:'MOD08',  type:'depends'},
  {source:'MOD06', target:'MOD11',  type:'depends'},
  {source:'MOD08', target:'MOD09',  type:'depends'},
  {source:'MOD08', target:'MOD13',  type:'depends'},
  {source:'MOD07', target:'MOD16',  type:'depends'},
  {source:'MOD33b',target:'MOD16',  type:'depends'},
  {source:'MOD33b',target:'MOD33f', type:'extends'},
  // P1→P2
  {source:'MOD10', target:'MOD11',  type:'depends'},
  {source:'MOD11', target:'MOD12',  type:'depends'},
  {source:'MOD11', target:'MOD15',  type:'depends'},
  {source:'MOD16', target:'MOD15',  type:'depends'},
  // P2→P3
  {source:'MOD12', target:'MOD12x', type:'extends'},
  {source:'MOD08', target:'MOD28',  type:'depends'},
  {source:'MOD09', target:'MOD28',  type:'extends'},
  {source:'MOD33f',target:'MOD34',  type:'depends'},
  {source:'MOD33f',target:'MOD35',  type:'depends'},
  {source:'MOD05', target:'MOD18',  type:'depends'},
  {source:'MOD18', target:'MOD18x', type:'extends'},
  // P3→P4
  {source:'MOD11', target:'MOD23',  type:'depends'},
  {source:'MOD08', target:'MOD17',  type:'depends'},
  {source:'MOD17', target:'MOD23',  type:'depends'},
  {source:'MOD12x',target:'MOD23',  type:'depends'},
  // P4→P5
  {source:'MOD06', target:'API01',  type:'api'},
  {source:'MOD08', target:'API01',  type:'api'},
  {source:'MOD07', target:'API02',  type:'api'},
  {source:'MOD23', target:'API03',  type:'api'},
  {source:'MOD18x',target:'API04',  type:'api'},
  // →P6
  {source:'MOD24', target:'MOD19',  type:'ai'},
  {source:'MOD24', target:'MOD20',  type:'ai'},
  {source:'MOD24', target:'MOD21',  type:'ai'},
  {source:'MOD24', target:'MOD25',  type:'ai'},
  {source:'MOD17', target:'MOD19',  type:'ai'},
  {source:'MOD17', target:'MOD25',  type:'ai'},
  {source:'MOD08', target:'MOD22',  type:'ai'},
  {source:'MOD11', target:'MOD22',  type:'ai'},
  {source:'API01', target:'MOD19',  type:'ai'},
  {source:'API01', target:'MOD22',  type:'ai'},
  {source:'API03', target:'MOD19',  type:'ai'},
  {source:'MOD21', target:'MOD23',  type:'depends'},
  {source:'MOD19', target:'MOD23',  type:'depends'},
];

// ---- Setup ----
const svg = d3.select('#graph').attr('viewBox', `0 0 ${W} ${H}`).attr('height', Math.min(840, window.innerHeight - 150));
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.25, 4]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Arrow markers
const defs = svg.append('defs');
const LINK_COLORS = {depends:'#b0b0be', extends:'#2A7A6E', api:'#6A4A9A', ai:'#D44422'};
Object.entries(LINK_COLORS).forEach(([type, color]) => {
  defs.append('marker').attr('id', `ar-${type}`)
    .attr('viewBox','0 -5 10 10').attr('refX', 26).attr('refY', 0)
    .attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto')
    .append('path').attr('d','M0,-5L10,0L0,5').attr('fill', color).attr('fill-opacity', 0.7);
});

// Phase lane backgrounds and labels
Object.entries(PHASE_X).forEach(([phase, cx]) => {
  g.append('rect').attr('class','phase-bg').attr('x', cx-82).attr('y', 42)
    .attr('width', 164).attr('height', H-54).attr('fill', PHASE_COLORS[phase]).attr('rx', 8);
  g.append('text').attr('class','phase-lbl').attr('x', cx).attr('y', 28)
    .attr('fill', PHASE_COLORS[phase]).text(PHASE_LABELS[phase]);
});

// Initial node positions spread within phase columns
nodes.forEach((n, i) => {
  const col = nodes.filter(m => m.phase === n.phase);
  const idx = col.indexOf(n);
  const step = (H - 120) / (col.length + 1);
  n.x = PHASE_X[n.phase] + (idx % 2 === 0 ? 0 : 14);
  n.y = 70 + step * (idx + 1);
});

// Links
const linkSel = g.append('g').selectAll('.link')
  .data(links).join('path')
  .attr('class', d => `link ${d.type}`)
  .attr('marker-end', d => `url(#ar-${d.type})`);

// Nodes
const nodeSel = g.append('g').selectAll('.node')
  .data(nodes).join('g').attr('class', 'node')
  .call(d3.drag().on('start', ds).on('drag', dd).on('end', de));

nodeSel.append('circle').attr('r', 23)
  .attr('fill', d => PHASE_COLORS[d.phase])
  .attr('fill-opacity', 0.88)
  .attr('stroke', '#fff');

// Legal risk ring
nodeSel.filter(d => d.legal)
  .append('circle').attr('class','risk-ring').attr('r', 27)
  .attr('fill','none').attr('stroke','#C4502A')
  .attr('stroke-width', 1.8).attr('stroke-dasharray','4,3').attr('stroke-opacity', 0.75);

// Icon
nodeSel.append('text').attr('class','node-icon').attr('dy','0.35em').text(d => d.icon);

// Labels (split on \n)
nodeSel.each(function(d) {
  const lines = d.label.split('\n');
  lines.forEach((line, i) => {
    d3.select(this).append('text').attr('class','node-label')
      .attr('y', 31 + i * 13).text(line);
  });
});

// Force simulation
const sim = d3.forceSimulation(nodes)
  .force('link',   d3.forceLink(links).id(d => d.id).distance(90).strength(0.25))
  .force('charge', d3.forceManyBody().strength(-320))
  .force('x',      d3.forceX(d => PHASE_X[d.phase]).strength(0.85))
  .force('y',      d3.forceY(H / 2).strength(0.08))
  .force('collide',d3.forceCollide(36))
  .on('tick', tick);

function tick() {
  linkSel.attr('d', d => {
    const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    // Offset the path slightly so overlapping opposite-direction links don't collide
    const dr = len * 0.75;
    return `M${d.source.x},${d.source.y} A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
  });
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
}

function ds(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dd(e, d) { d.fx = e.x; d.fy = e.y; }
function de(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }

// ---- Interactions ----
const tip = document.getElementById('tooltip');
const ttPhase = document.getElementById('tt-phase');
const ttName  = document.getElementById('tt-name');
const ttDesc  = document.getElementById('tt-desc');

nodeSel
  .on('mouseenter', function(ev, d) {
    const conn = new Set([d.id]);
    links.forEach(l => {
      if (l.source.id === d.id) conn.add(l.target.id);
      if (l.target.id === d.id) conn.add(l.source.id);
    });
    nodeSel.classed('dim', n => !conn.has(n.id));
    linkSel.classed('dim',       l => l.source.id !== d.id && l.target.id !== d.id)
           .classed('highlight', l => l.source.id === d.id || l.target.id === d.id);
    ttPhase.style.color = PHASE_COLORS[d.phase];
    ttPhase.textContent = `${d.phase} · ${d.unit}`;
    ttName.textContent  = d.short;
    ttDesc.textContent  = d.desc;
    tip.style.display = 'block';
  })
  .on('mousemove', function(ev) {
    tip.style.left = Math.min(ev.clientX + 18, window.innerWidth - 300) + 'px';
    tip.style.top  = (ev.clientY - 50) + 'px';
  })
  .on('mouseleave', function() {
    nodeSel.classed('dim', false);
    linkSel.classed('dim', false).classed('highlight', false);
    tip.style.display = 'none';
  })
  .on('click', function(ev, d) {
    ev.stopPropagation();
    const panel = document.getElementById('detail');
    document.getElementById('d-phase').textContent = `${d.phase} · ${d.unit}`;
    document.getElementById('d-phase').style.color = PHASE_COLORS[d.phase];
    document.getElementById('d-name').textContent  = d.short;
    document.getElementById('d-unit').textContent  = d.desc;
    document.getElementById('d-legal-badge').style.display = d.legal ? 'block' : 'none';

    const deps    = links.filter(l => l.target.id === d.id);
    const enables = links.filter(l => l.source.id === d.id);

    if (deps.length) {
      document.getElementById('d-deps-sec').style.display = 'block';
      document.getElementById('d-deps').innerHTML = deps.map(l => {
        const src = nodes.find(n => n.id === l.source.id);
        return `<li>${src ? src.short : l.source.id}</li>`;
      }).join('');
    } else {
      document.getElementById('d-deps-sec').style.display = 'none';
    }
    if (enables.length) {
      document.getElementById('d-enables-sec').style.display = 'block';
      document.getElementById('d-enables').innerHTML = enables.map(l => {
        const tgt = nodes.find(n => n.id === l.target.id);
        return `<li>${tgt ? tgt.short : l.target.id}</li>`;
      }).join('');
    } else {
      document.getElementById('d-enables-sec').style.display = 'none';
    }
    panel.style.display = 'block';
  });

svg.on('click', () => document.getElementById('detail').style.display = 'none');

// ---- Phase filter ----
let activePhase = null;
document.querySelectorAll('.ctrl-btn[data-phase]').forEach(btn => {
  btn.addEventListener('click', function() {
    const ph = this.dataset.phase;
    document.querySelectorAll('.ctrl-btn[data-phase]').forEach(b => b.classList.remove('active'));
    if (ph === 'all' || ph === activePhase) {
      activePhase = null;
      document.querySelector('[data-phase="all"]').classList.add('active');
      nodeSel.classed('dim', false);
      linkSel.classed('dim', false);
    } else {
      activePhase = ph;
      this.classList.add('active');
      // Show selected phase + adjacent phases (via links)
      const show = new Set([ph]);
      links.forEach(l => {
        if (l.source.phase === ph) show.add(l.target.phase);
        if (l.target.phase === ph) show.add(l.source.phase);
      });
      nodeSel.classed('dim', d => !show.has(d.phase));
      linkSel.classed('dim', l => !show.has(l.source.phase) || !show.has(l.target.phase));
    }
  });
});

document.getElementById('btn-reset').addEventListener('click', () => {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
});
</script>
</body>
